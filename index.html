  <!-- Full viewport container for hero + quotes -->
  <div class="hero-viewport">

    <!-- hero section -->
    <section class="hero" id="home">
      <main class="content">
        <h1>Selamat Datang di Website <span style="font-style: italic; color: #0db9d7;">RPL1</span></h1>
        <div id="countdown-display" class="countdown-container"></div>
      </main>
      <div class="homeimg">
        <div id="graduation-3d"></div>
      </div>
    </section>

    <!-- Typed.js quotes -->
    <section class="typed-section">
      <div class="typed-wrapper">
        <span id="typed-output"></span>
      </div>
    </section>

  </div>

  <!-- particles background (for starfield effect after 30 days) -->
  <div id="particles-bg"></div>

  <!-- Icon Chat -->
  <div id="chat-icon">
    <i class="bx bx-chat"></i>
  </div>

  <!-- Chat Popup -->
  <div id="chat-popup" class="hidden">
    <div class="chat-container">
      <div class="chat-header">
        <h2>Chat</h2>
        <div id="auth-container">
          <button id="google-login-btn" class="google-login-btn">
            <i class="bx bxl-google"></i> Login
          </button>
          <div id="user-info" class="user-info" style="display:none">
            <img id="user-avatar" class="user-avatar" src="" alt="" referrerpolicy="no-referrer" />
            <span id="user-name"></span>
            <button id="logout-btn" class="logout-btn"><i class="bx bx-log-out"></i></button>
          </div>
        </div>
      </div>
      <div id="chat-output" class="chat-output"></div>
      <div class="chat-input-container">
        <textarea id="message-input" placeholder="Login untuk mengirim pesan..." rows="3" disabled></textarea>
        <button id="send-btn" disabled>
          <i class="bx bx-send"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- CDN Scripts -->

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

  <!-- Chat (Firebase module) -->
  <script type="module" src="js/scripts.js"></script>

  <!-- Feature modules -->
  <script type="module">
    import { initCountdown } from './js/countdown.js';
    import { initGraduation3D } from './js/graduation3d.js';
    import { CONFIG } from './js/config.js';

    // ES modules are deferred — DOM is always ready when they run

    initCountdown();
    initGraduation3D();

    // Typed.js — init immediately since CDN scripts loaded before modules
    function initTyped() {
      const el = document.getElementById('typed-output');
      if (window.Typed && el) {
        new Typed('#typed-output', {
          strings: CONFIG.TYPED_QUOTES,
          typeSpeed: 30,
          backSpeed: 15,
          backDelay: 4000,
          startDelay: 1500,
          loop: true,
          showCursor: true,
          cursorChar: '|'
        });
      }
    }

    // Try now, retry on load if CDN not ready
    if (window.Typed) {
      initTyped();
    } else {
      window.addEventListener('load', initTyped);
    }
  </script>

  <!-- Global script (navbar, gallery, etc) -->
  <script src="js/script.js"></script>
