<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Struktur Kelas</title>

  <link rel="icon" type="image/ico" href="favicon_io/favicon.ico" />
  <link rel="manifest" href="favicon_io/site.webmanifest" />

  <!-- Metadata untuk media sosial (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rpl1-026.github.io/Website-RPL1-Skema-">
  <meta property="og:title" content="RPL 1 - 026">
  <meta property="og:description"
    content="The official website for the 17th batch, class RPL 1 (Software Engineering), graduating in 2026, at SMK Negeri 5 Kendal.">
  <meta property="og:image" content="https://rpl1-026.github.io/Website-RPL1-Skema-/Aset/logo.webp">

  <!-- Metadata Twitter (opsional, tapi bagus untuk konsistensi) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://rpl1-026.github.io/Website-RPL1-Skema-">
  <meta name="twitter:title" content="RPL 1 - 026">
  <meta name="twitter:description"
    content="The official website for the 17th batch, class RPL 1 (Software Engineering), graduating in 2026, at SMK Negeri 5 Kendal.">
  <meta name="twitter:image" content="https://rpl1-026.github.io/Website-RPL1-Skema-/Aset/logo.webp">

  <link rel="canonical" href="https://rpl1-026.github.io/Website-RPL1-Skema-">

  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,700;1,700&display=swap"
    rel="stylesheet" />

  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <!-- css -->
  <link rel="stylesheet" href="style.css" />
    <!-- Instant Nostalgia Filter -->
    <script>
      if (localStorage.getItem('nostalgia_active') === 'true') {
        var filter = localStorage.getItem('nostalgia_filter') || 'sepia(0.15) grayscale(0.25) brightness(0.9)';
        document.write('<style id="nostalgia-style">html::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 99990; backdrop-filter: ' + filter + '; -webkit-backdrop-filter: ' + filter + '; }</style>');
      }
    </script>
</head>

<body>
  <!-- navbar start-->
  <nav class="navbar">
    <a href="#" class="navbar-logo"><img src="Aset/logo.webp" alt="RPL 1" /></a>
    <div class="navbar-nav">
      <a href="index.html">Beranda</a>
      <a href="aboute.html">Tentang Kami</a>
      <a href="walisiswa.html">Wali & Siswa</a>
      <a href="gallery.html">Galeri Kelas</a>
    </div>
    <div class="navbar-extra">
      <a href="https://www.tiktok.com/@booksrpl1/" target="_blank">
        <i class="bx bxl-tiktok" id="tiktok-icon"></i>
      </a>
      <a href="https://www.instagram.com/booksrplsatu/" target="_blank">
        <i class="bx bxl-instagram" id="instagram-icon"></i>
      </a>
      <a href="https://open.spotify.com/playlist/5hYpIINv6GzYWjJIUMpmZm?si=mTjUb_99TISzrOZE-AYGxw" target="_blank">
        <i class="bx bxl-spotify" id="spotify-icon"></i>
      </a>
      <a href="https://github.com/RPL1-026/" target="_blank">
        <i class="bx bxl-github" id="github-icon"></i>
      </a>
      <a href="#" id="hamburger-menu">
        <i class="bx bx-menu"></i>
      </a>
    </div>
  </nav>
  <!-- navbar end -->

  <!-- profile section start -->
  <section id="profile-section" class="profile-background">
    <!-- Modal Structure -->
    <div id="details-modal" class="modal">
      <div class="modal-content card-style">
        <div id="modal-details"></div>
      </div>
    </div>

    <h2 data-aos="fade-up">Wali <span>&</span> Siswa</h2>

    <!-- Wali Kelas (rendered from JSON) -->
    <div id="teacher-card-container" data-aos="fade-up"></div>

    <!-- Banner Rekapan Nilai -->
    <div class="rekapan-banner" data-aos="fade-up">
      <a href="https://rpl1-026.github.io/rekapan-pembelajaran-rpl1-17/" target="_blank">
        <i class="bx bx-bar-chart-alt-2"></i>
        <span>Lihat Rekapan Nilai Kelas RPL1</span>
        <i class="bx bx-right-arrow-alt"></i>
      </a>
    </div>

    <!-- Murid-Murid (rendered from JSON) -->
    <div class="student-cards" id="student-cards-container">
      <div class="loading-placeholder">Memuat data siswa...</div>
    </div>
  </section>

  <!-- particles background -->
  <div id="particles-bg"></div>

  <!-- Icon Chat -->
  <div id="chat-icon">
    <i class="bx bx-chat"></i>
  </div>

  <!-- Chat Popup -->
  <div id="chat-popup" class="hidden">
    <div class="chat-container">
      <div class="chat-header">
        <h2>Chat</h2>
        <div id="auth-container">
          <button id="google-login-btn" class="google-login-btn">
            <i class="bx bxl-google"></i> Login
          </button>
          <div id="user-info" class="user-info" style="display:none">
            <img id="user-avatar" class="user-avatar" src="" alt="" referrerpolicy="no-referrer" />
            <span id="user-name"></span>
            <button id="logout-btn" class="logout-btn"><i class="bx bx-log-out"></i></button>
          </div>
        </div>
      </div>
      <div id="chat-output" class="chat-output"></div>
      <div class="chat-input-container">
        <textarea id="message-input" placeholder="Login untuk mengirim pesan..." rows="3" disabled></textarea>
        <button id="send-btn" disabled>
          <i class="bx bx-send"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- CDN Scripts -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

  <!-- Chat -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script type="module" src="js/scripts.js"></script>

  <!-- Feature modules -->
  <script type="module">
    import { renderStudents } from './js/renderStudents.js';
    import { initCursor } from './js/cursor.js';
    import { initAnimations } from './js/animations.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initAnimations();
      await renderStudents();
      initCursor();
    });
  </script>

  <!-- Global script -->
  <script src="js/script.js"></script>
</body>

</html>
